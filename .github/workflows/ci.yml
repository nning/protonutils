on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Build, Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vulncheck

      # The encrypted copy of real Steam data is only available if the secret
      # is (not for pull requests from forks). Tests using it are skipped
      # otherwise, tests with synthetic data always run.
      - name: Prepare Steam Root for Tests
        if: env.KEY != ''
        run: |
          echo "$KEY" > key.age
          curl -sSL https://dl.filippo.io/age/v1.2.1?for=linux/amd64 | tar xzf -
          PATH="$(pwd)/age:$PATH" ./test/decrypt.sh ../key.age
        env:
          KEY: ${{ secrets.STEAM_ROOT_KEY }}

      - name: Test
        run: make test

      - name: Build
        run: make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonutils
          path: cmd/protonutils/protonutils
