on:
  push:
    tags: 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: |
          sudo apt-get update
          sudo apt-get -y install upx-ucl

      - run: make test

      - run: make release release_arm64 checksums

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cmd/protonutils/protonutils
            cmd/protonutils/protonutils-arm64
            cmd/protonutils/SHA256SUMS
